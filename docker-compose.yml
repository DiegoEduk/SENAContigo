version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: senacontigo_postgres
    restart: always
    environment:
      POSTGRES_DB: senacontigo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sdfwpostgr23424++
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: senacontigo_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: senacontigo_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:sdfwpostgr23424++@db:5432/senacontigo
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      SECRET_KEY: sdfkljj3#$#$%345sadf**9898sdfl32asldjf=)/#$¿¿weqwer
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
